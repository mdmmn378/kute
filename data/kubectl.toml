category = "security"

[[snippet]]
cmd = "kubectl auth can-i create deployments --as=system:serviceaccount:NS:SA -n NS"
desc = "Check whether a ServiceAccount can create deployments"
tags = ["auth", "serviceaccount", "rbac"]
category = "security"

[[snippet]]
cmd = "kubectl get role,rolebinding -n NS"
