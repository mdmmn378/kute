[[snippet]]
cmd = "kubectl get secrets -n NS -o jsonpath='{.items[*].metadata.name}'"
desc = "List secret names without exposing their contents"
tags = ["secret", "list", "security"]
category = "security"

[[snippet]]
cmd = "kubectl get secret NAME -n NS -o jsonpath='{.data.KEY}' | base64 -d"
desc = "Decode one key from a Secret"
