# ── Output shaping and automation ───────────────────────────────────────────

[[snippet]]
cmd = "kubectl get pods -n NS -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.status.phase}{\"\\n\"}{end}'"
desc = "Tab-separated name/phase table via jsonpath ranges"
