[[snippet]]
cmd = "kubectl get pods -n NS -o yaml > pods.yaml"
desc = "Snapshot live objects to a file"
tags = ["yaml", "export", "backup"]
category = "output"

[[snippet]]
cmd = "kubectl get pods -n NS -l app=NAME -o json | jq -r '.items[].metadata.name'"
desc = "Use jq to extract names from a JSON list"
