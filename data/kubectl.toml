# ── Cleanup and namespace lifecycle ─────────────────────────────────────────

[[snippet]]
cmd = "kubectl delete namespace NS --wait=false"
desc = "Delete a namespace without blocking the terminal"
tags = ["delete", "namespace", "cleanup"]
category = "cleanup"

[[snippet]]
cmd = "kubectl get namespace NS -o json | jq '.spec.finalizers=[]' | kubectl replace --raw /api/v1/namespaces/NS/finalize -f -"
desc = "Force a namespace stuck in Terminating to finish"
tags = ["namespace", "stuck", "finalizer", "terminating"]
category = "cleanup"

[[snippet]]
cmd = "kubectl get pods -A --field-selector=status.phase=Succeeded -o name | xargs -r kubectl delete"
desc = "Clean up completed pods across the cluster"
tags = ["cleanup", "succeeded", "pods"]
category = "cleanup"

[[snippet]]
cmd = "kubectl delete pod POD -n NS --grace-period=0 --force"
desc = "Force-delete a pod wedged in Terminating"
tags = ["delete", "force", "terminating"]
category = "cleanup"

[[snippet]]
cmd = "kubectl get pods -A --field-selector=status.phase=Failed -o name | xargs -r kubectl delete"
desc = "Delete failed and evicted pods across the cluster"
tags = ["evicted", "failed", "cleanup"]
category = "cleanup"
