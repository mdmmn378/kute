apiVersion: apps/v1
kind: Deployment
{% include "_meta.yaml" %}
spec:
  replicas: {{ replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{ selector_key }}: "{{ selector_value }}"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
{% include "_podmeta.yaml" %}
    spec:
{%- if let Some(sa) = service_account %}
      serviceAccountName: {{ sa }}
{%- endif %}
{% include "_workload_container.yaml" %}
{%- if !volumes.is_empty() %}
{% include "_volumes.yaml" %}
{%- endif %}
