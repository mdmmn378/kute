name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint-and-test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

  completions:
    name: completions generate for every shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # The completion scripts are generated from the clap command tree, so a
      # broken command definition would show up here rather than in a user's shell.
      - name: Smoke-test completions
        run: |
          set -euo pipefail
          for shell in bash zsh fish powershell elvish; do
            ./target/release/kute completions "$shell" > "/tmp/kute.$shell"
            test -s "/tmp/kute.$shell"
          done
          grep -q "kute" /tmp/kute.bash

  installer:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # curl | sh is the primary install path, so it gets its own test.
      - name: Test the installer against a stubbed release
        run: bash scripts/test-install.sh .
